<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
        }

        .email-container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            font-size: 16px;
        }

        .header {
            background-color: #fa5a32;
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid #ddd;
        }

            .header h1 {
                font-size: 28px;
                margin: 0;
                font-weight: 600;
                letter-spacing: 1px;
            }

        .content {
            padding: 30px 20px;
            text-align: center;
        }

            .content p {
                color: #333;
                font-size: 18px;
                line-height: 1.5;
                margin-bottom: 20px;
            }

            .content img {
                width: 100%;
                max-width: 550px;
                height: auto;
                border-radius: 10px;
                margin-bottom: 20px;
                box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            }

        .btn {
            background-color: #fa5a32;
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 30px;
            display: inline-block;
            transition: background-color 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

            .btn:hover {
                background-color: #f19a68;
            }

        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #777;
        }

            .footer a {
                color: #fa5a32;
                text-decoration: none;
                font-weight: 500;
            }

                .footer a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>¡Hola {{NombreUsuario}} es un gusto volver a saludarte!</h1>
        </div>
        <div class="content">
            <p style="font-size: 23px;">Tu próxima entevista esta cerca</p>
            <img src="https://media.istockphoto.com/id/1384110533/es/foto/director-masculino-asi%C3%A1tico-est%C3%A1-entrevistando-para-reclutar-nuevos-empleados.jpg?s=612x612&w=0&k=20&c=KP4g3O_379o8Rt8Ipxi5ddJjqGTWGukMebvEboq8EC0=" alt="Imagen bienvenida" />
            <p style="align-items: start;">Tipo de Entrevista: {{TipoEntrevista}}</p>
            <p>Fecha: {{Fecha}}</p>
            <p>Piso: {{Piso}}</p>
            <a href="https://www.linkedin.com/in/hugo-leon-negrete-24842535b/" class="btn">Confirmar Asistencia</a>
        </div>
        <div class="footer">
            <p>Más Acerca de Nosotros <a href="https://digis01.com/">Digis01 Soluciones Digitales</a></p>
        </div>
    </div>
</body>
</html>
